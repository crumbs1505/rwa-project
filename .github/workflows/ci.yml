name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compile
        run: npx hardhat compile

      - name: Typecheck
        run: npm run typecheck

      - name: Check frontend ABIs are up to date
        run: |
          node scripts/export-abis.mjs
          git diff --exit-code frontend/src/abi.ts

      - name: Test with coverage
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      # Slither >= 0.11.6 understands Hardhat 3 build output; compile first
      # and let Slither read the artifacts. slither.config.json fails the job
      # on medium-severity findings or above.
      - name: Install Slither
        run: pip install slither-analyzer==0.11.6

      - name: Compile
        run: npx hardhat compile

      - name: Slither
        run: slither . --ignore-compile

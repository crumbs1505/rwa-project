name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compile
        run: npx hardhat compile

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs Node and the project's dependencies, compiles with Hardhat
      # and fails on any finding of medium severity or above
      - uses: crytic/slither-action@v0.4.1
        with:
          node-version: 22
          fail-on: medium
